services:
  assets:
    image: node:22-alpine
    container_name: agrovida-assets
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm ci && npm run build"
    profiles:
      - assets
    networks:
      - agrovida-net

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrovida-laravel
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    env_file:
      - .env.docker
    environment:
      SESSION_DRIVER: file
    depends_on:
      db:
        condition: service_started
    networks:
      - agrovida-net

  nginx:
    image: nginx:latest
    container_name: agrovida-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - agrovida-net

  db:
    image: postgres:16
    container_name: agrovida-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercado_agricola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - agrovida-net

networks:
  agrovida-net:
    driver: bridge

volumes:
  db-data:
