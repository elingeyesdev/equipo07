services:
  assets:
    image: node:22-alpine
    container_name: agrovida-assets
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm ci && npm run build"
    profiles:
      - assets
    networks:
      - agrovida-net

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrovida-laravel
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/php/performance.ini:/usr/local/etc/php/conf.d/performance.ini
    env_file:
      - .env.docker
    environment:
      SESSION_DRIVER: cookie
      CACHE_STORE: array
    depends_on:
      db:
        condition: service_started
    networks:
      - agrovida-net

  nginx:
    image: nginx:latest
    container_name: agrovida-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - agrovida-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: agrovida-ngrok
    profiles:
      - tunnel
    command:
      - http
      - nginx:80
      - --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - agrovida-net

  db:
    image: postgres:16
    container_name: agrovida-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercado_agricola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - agrovida-net

networks:
  agrovida-net:
    driver: bridge

volumes:
  db-data:
